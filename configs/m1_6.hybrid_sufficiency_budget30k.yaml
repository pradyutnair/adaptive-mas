variant: m1_6_hybrid_sufficiency_budget30k

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  sufficiency_controller: true
  sufficiency_threshold: 0.65
  sufficiency_max_recurse_steps: 4
  sufficiency_min_recurse_steps: 1
  sufficiency_bridge_first_probe: true
  sufficiency_split_assessment: true
  sufficiency_typed_plan_exec_on_hard: true
  sufficiency_cached_full_question_probe: true
  sufficiency_recurse_only_after_plan_exec_failure: false
  sufficiency_max_plan_exec_steps: 4
  sufficiency_max_recovery_steps: 0
  sufficiency_max_slot_attempts: 2
  sufficiency_enable_slot_rewrite: true
  sufficiency_plan_exec_search_top_k: 4
  sufficiency_plan_exec_max_read: 4
  sufficiency_recurse_search_top_k: 4
  sufficiency_recurse_max_read: 4
  bootstrap_search_top_k: 5
  bootstrap_max_read: 6

budget:
  max_total_tokens: 30000

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
