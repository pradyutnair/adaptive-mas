# v7: Qwen3-8B+thinking for planner/strategist, gpt-4o-mini for investigator
# Full chunk text (no truncation), top_k=8, max_evidence_hits=8

llm_defaults:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_tokens: 1024
  enable_thinking: false
  timeout_seconds: 600

agents:
  planner:
    model: Qwen/Qwen3-8B
    base_url: http://localhost:8001/v1
    api_key: EMPTY
    enable_thinking: true
    max_tokens: 4096
  investigator:
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    enable_thinking: false
    max_tokens: 1024

retriever:
  base_url: http://node408:8003
  top_k: 8
  timeout_seconds: 30

pipeline:
  max_subgoals: 4
  max_searches_per_subagent: 3
  max_hop_attempts: 3
  max_review_rounds: 2
  min_fact_confidence: 0.3
  max_answer_words: 8
  max_evidence_hits: 8
  max_excerpt_chars: 9999
  router_enabled: false

runner:
  concurrency: 8
