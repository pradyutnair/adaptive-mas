variant: m5_cursor_style

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  min_fact_confidence: 0.3

fact_memory:
  capacity: 6
  strategy: salience

adaptive:
  delegated_max_slots: 6
  bootstrap_search_top_k: 5
  bootstrap_max_read: 6
  route_temperature: 0.0

budget:
