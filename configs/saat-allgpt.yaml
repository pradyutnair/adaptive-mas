# SAAT/AMAS v2 with GPT-4o-mini for every role.

llm_defaults:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_tokens: 1024
  enable_thinking: false
  timeout_seconds: 600

agents:
  planner:
    max_tokens: 2048
  investigator:
    max_tokens: 1024
  synthesizer:
    max_tokens: 1024

retriever:
  base_url: http://node408:8003
  top_k: 10
  timeout_seconds: 30

pipeline:
  max_subgoals: 6
  max_searches_per_subagent: 2
  min_fact_confidence: 0.3
  max_answer_words: 8

runner:
  concurrency: 8
