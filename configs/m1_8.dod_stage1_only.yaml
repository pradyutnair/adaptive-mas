# m1.8 S0 ablation: direct SAS only, using the same deterministic gate diagnostics.

variant: m1_8_dod_stage1_only

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 2
  search_top_k: 4
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  dod_controller: true
  dod_stage1_only: true
  dod_gate_threshold: 0.85
  slot_dag_search_top_k: 4
  bootstrap_max_read: 4

budget:
  max_total_tokens: 30000

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 1536
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 16
  checkpoint: true
