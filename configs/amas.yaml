# AMAS - adaptive multi-agent QA (Cursor-style emergent topology).
# One lead orchestrator chooses search / spawn / final each turn.
# Investigators are isolated subagents; multiple can run in parallel per spawn.

llm_defaults:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  api_key: EMPTY
  temperature: 0.0
  max_tokens: 1024
  enable_thinking: false
  timeout_seconds: 600

agents:
  orchestrator:                  # Qwen3-8B + thinking (the brain)
    enable_thinking: true
    max_tokens: 4096
  investigator:                  # GPT-4o-mini (parallel-friendly worker)
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    enable_thinking: false
    max_tokens: 1024

retriever:
  base_url: http://node408:8003
  top_k: 10
  timeout_seconds: 30

pipeline:
  max_turns: 8                   # max orchestrator turns
  max_searches_per_subagent: 3   # search budget inside an investigator
  min_fact_confidence: 0.3
  max_answer_words: 8            # softly penalise long enumeration answers

runner:
  concurrency: 8
