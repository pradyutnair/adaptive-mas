{
  "llm_defaults": {
    "model": "gpt-4o-mini",
    "base_url": "https://api.openai.com/v1",
    "api_key_env": "OPENAI_API_KEY",
    "temperature": 0.0,
    "max_tokens": 1024,
    "enable_thinking": false,
    "timeout_seconds": 600
  },
  "agents": {
    "planner": {
      "max_tokens": 2048
    },
    "investigator": {
      "max_tokens": 1024
    },
    "synthesizer": {
      "max_tokens": 1024
    }
  },
  "retriever": {
    "base_url": "http://127.0.0.1:9110",
    "top_k": 10,
    "timeout_seconds": 30,
    "request_format": "batch"
  },
  "pipeline": {
    "max_subgoals": 6,
    "max_searches_per_subagent": 1,
    "min_fact_confidence": 0.3,
    "max_answer_words": 64,
    "direct_probe_top_k": 5,
    "direct_probe_max_searches": 2,
    "direct_probe_confidence": 0.78,
    "max_hop_attempts": 3,
    "max_evidence_hits": 12,
    "max_excerpt_chars": 900,
    "final_recovery_attempts": 3,
    "final_recovery_top_k": 14
  },
  "runner": {
    "concurrency": 8
  }
}