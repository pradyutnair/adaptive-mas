# iter55: adaptive outer route + OPERA-style recurse with forced bridge-first planner and placefix placeholder extraction.
variant: iter55_opera_adaptive_bridgefirst_placefix

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  max_read: 8
  chunk_max_chars: 1800
  query_snippet_max_chars: 900
  min_fact_confidence: 0.45
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  use_opera_adaptive: true
  use_hybrid_chain_exec: false
  use_routed_controller: false
  route_direct_threshold: 0.85
  route_probe_threshold: 0.6
  direct_answer_threshold: 0.9
  final_answer_threshold: 0.8

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 1536
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
