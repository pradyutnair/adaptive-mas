# Adaptive Recursive SAGE — A1 matched
# Always-spawn baseline with the same retrieval/distillation scaffold as iter30-think.

variant: a1_matched

orchestrator:
  max_steps: 5
  max_verify_calls: 1

ablation:
  force_spawn: true

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
