# Delegation-as-topology controller (m2)
# One resource-aware assessment call decides direct vs scoped delegation.

variant: m2_delegated_topology

orchestrator:
  max_steps: 3
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  min_fact_confidence: 0.50

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  delegated_topology_controller: true
  delegated_token_budget: 15000
  delegated_max_slots: 2
  delegated_direct_attempts: 2
  delegated_direct_retry_top_k: 10
  delegated_slot_retry_top_k: 10
  topology_max_slot_calls: 2
  topology_recovery_calls: 0
  max_parallel_hops: 2
  bootstrap_search_top_k: 5
  bootstrap_max_read: 6
  answer_justification_threshold: 0.55
  route_temperature: 0.0

budget:
  max_total_tokens: 18000

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: /local/yzheng/pnair/.cache/huggingface/models--intfloat--e5-base-v2/snapshots/f52bf8ec8c7124536f0efb74aca902b2995e5bcd

runner:
  concurrency: 24
  checkpoint: true
  max_questions: 50
