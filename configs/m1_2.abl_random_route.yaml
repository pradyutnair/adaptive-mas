# Ablation: replace the calibrated sufficiency signal with a Bernoulli draw
# at the configured mix rate p. Demonstrates that the learned signal is
# load-bearing relative to a random router with the same routing entropy.
#
# The shipped main run for each dataset reports its empirical
# answer-from-probe rate; set sufficiency_random_route_p to that rate so
# this ablation routes at matched mix.

variant: m1_2_sufficiency_abl_random_route

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  sufficiency_controller: true
  sufficiency_threshold: 0.70
  sufficiency_max_recurse_steps: 4
  sufficiency_min_recurse_steps: 1
  bootstrap_search_top_k: 5
  bootstrap_max_read: 6

ablation:
  sufficiency_random_route: true
  sufficiency_random_route_p: 0.50
  sufficiency_random_route_seed: 42

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
