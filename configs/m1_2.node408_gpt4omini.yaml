# m1.2 sufficiency on node408 with GPT-4o-mini

variant: m1_2_sufficiency_node408_gpt4omini

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 3
  search_top_k: 4
  max_passage_chars: 1000
  max_query_variants: 2
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  sufficiency_controller: true
  sufficiency_threshold: 0.70
  sufficiency_max_recurse_steps: 4
  sufficiency_min_recurse_steps: 1
  bootstrap_search_top_k: 4
  bootstrap_max_read: 4

llm:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  temperature: 0.0
  max_tokens: 1024

data:
  retriever_url: http://node408:8003/retrieve

runner:
  concurrency: 6
  checkpoint: true
