[project]
name = "amas"
version = "0.1.0"
description = "AMAS dual-gate thesis system"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "openai>=1.30",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "wandb>=0.16",
  "tqdm>=4.66",
  "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
