vllm:
  endpoints:
    - http://localhost:8001/v1
    - http://localhost:8002/v1
    - http://localhost:8003/v1
  model: Qwen/Qwen3-14B
  max_tokens: 1024
  temperature: 0.7
  concurrency: 24

openai:
  model: gpt-4o-mini
  max_tokens: 768
  temperature: 0.3
  concurrency: 24

retriever:
  url: http://node408:8003/retrieve
  topk: 5
  concurrency: 8

pipeline:
  t_max: 1
  probe_group_size: 1
  probe_topk: 5
  rollout_temperature: 0.0
  eval_temperature: 0.0

gate:
  name: conformal           # conformal | bayesian | oracle | random | off | sas_only
  alpha: 0.05
  calib_path: results/route_a_calibration.json
  lambda: 0.0008
  fallback_cost: 5000.0

paths:
  exp_lib: exp_lib/run01
  results: results/run01
  prompts: exp_lib/run01/prompts.json
  library: exp_lib/run01/library.json

wandb:
  enabled: true
  project_eval: amas-eval
  project_grpo: amas-grpo
  project_rope: amas-rope
  entity: null
