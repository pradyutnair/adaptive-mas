# AMAS - adaptive multi-agent QA, default configuration.
# Mixed provider: Qwen3-8B (local vLLM, thinking ON) for orchestrator roles;
# GPT-4o-mini (OpenAI) for investigator subagents (parallel-friendly, no thinking).

llm_defaults:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  api_key: EMPTY
  temperature: 0.0
  max_tokens: 1024
  enable_thinking: false
  timeout_seconds: 600

agents:
  orchestrator:                  # used for direct_solve (thinking ON)
    enable_thinking: true
    max_tokens: 4096
  planner:                       # decomposition planner (thinking ON)
    enable_thinking: true
    max_tokens: 4096
  refiner:                       # rewrites failed slot queries (no thinking)
    enable_thinking: false
    max_tokens: 512
  investigator:                  # GPT-4o-mini, isolated subagent
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    enable_thinking: false
    max_tokens: 1024

retriever:
  base_url: http://node408:8003
  top_k: 10
  timeout_seconds: 30

pipeline:
  direct_max_searches: 2          # SAS attempt budget at orchestrator level
  max_searches_per_subagent: 3    # search budget inside each isolated subagent
  max_rounds: 4                   # parallel-spawn rounds in the decompose loop
  max_slot_retries: 2             # per-slot refine + retry budget
  max_plan_hops: 6
  sufficiency_threshold: 0.6      # min confidence to accept the direct answer
  min_fact_confidence: 0.3        # min confidence for an investigator capsule
  max_total_tokens: 0             # 0 disables the hard cap

runner:
  concurrency: 8
