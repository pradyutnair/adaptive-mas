# Config 3: Qwen3-8B no-think for ALL agents.
# Fair apples-to-apples comparison vs OPERA (same model, same retriever).

llm_defaults:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  api_key: EMPTY
  temperature: 0.0
  max_tokens: 1024
  enable_thinking: false
  timeout_seconds: 600

agents:
  orchestrator:
    max_tokens: 2048
  investigator:
    max_tokens: 1024

retriever:
  base_url: http://node408:8003
  top_k: 10
  timeout_seconds: 30

pipeline:
  max_turns: 8
  max_searches_per_subagent: 5
  min_fact_confidence: 0.3
  max_answer_words: 8
  context_token_budget: 28000

runner:
  concurrency: 8
