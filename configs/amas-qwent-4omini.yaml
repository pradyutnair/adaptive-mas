# AMAS - adaptive multi-agent QA (Cursor-style emergent topology).
# One lead orchestrator chooses search / spawn / final each turn.
# Investigators are isolated subagents; multiple can run in parallel per spawn.

llm_defaults:
  model: Qwen/Qwen3-8B
  base_url: https://localhost:8000/v1

agents:
  orchestrator:
    model: Qwen/Qwen3-8B
    max_tokens: 2048
  investigator:
    max_tokens: 1024

retriever:
  base_url: http://node408:8003
  top_k: 10
  timeout_seconds: 30

pipeline:
  max_turns: 8                   # max orchestrator turns
  max_searches_per_subagent: 5   # search budget inside an investigator
  min_fact_confidence: 0.3
  max_answer_words: 8            # softly penalise long enumeration answers
  context_token_budget: 28000    # hard stop before vLLM 32k overflow (4k margin for thinking)

runner:
  concurrency: 8
