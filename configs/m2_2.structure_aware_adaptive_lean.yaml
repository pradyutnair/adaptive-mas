# Lean structure-aware adaptive controller (m2.2)
# Same controller as m2.1, with modest generic cost cuts:
#   - shallower targeted recovery
#   - slightly smaller retrieval fanout

variant: m2_2_structure_aware_adaptive_lean

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4
  search_top_k: 4
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  execution_mode_controller: true
  direct_probe_threshold: 0.45
  typed_plan_exec_threshold: 0.55
  recovery_trigger_threshold: 0.45
  max_plan_exec_steps: 4
  max_recovery_steps: 2
  enable_slot_rewrite: true
  enable_recursive_recovery: true
  bootstrap_search_top_k: 4
  bootstrap_max_read: 5

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
