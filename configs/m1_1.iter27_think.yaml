# Adaptive Recursive SAGE — M1.1 iter27 think
# Same controller as iter27 no-think, but with thinking enabled.

variant: m1_1_iter27_think

orchestrator:
  max_steps: 4
  max_verify_calls: 1

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  use_routed_controller: true
  enable_parallel_independent_hops: true
  max_parallel_hops: 2
  refine_budget_per_slot: 1
  route_direct_threshold: 0.85
  route_probe_threshold: 0.55
  require_support_for_final_answer: true
  enable_bootstrap_short_circuit: false
  direct_answer_threshold: 0.9
  final_answer_threshold: 0.80

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.6
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
