# Structure-adaptive slot executor (m3.3 no recovery)
# Same lean controller as m3.2, but recursive recovery is disabled.

variant: m3_3_structure_adaptive_slot_exec_no_recovery

orchestrator:
  max_steps: 3
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 3
  search_top_k: 3
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 3
  strategy: salience

adaptive:
  execution_mode_controller: true
  direct_probe_threshold: 0.45
  typed_plan_exec_threshold: 0.55
  recovery_trigger_threshold: 0.70
  max_plan_exec_steps: 3
  max_recovery_steps: 0
  enable_slot_rewrite: true
  enable_recursive_recovery: false
  assess_after_plan_step: true
  structure_slot_guided_recovery: false
  recover_conflicting_slots: false
  bootstrap_search_top_k: 3
  bootstrap_max_read: 4

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 640
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 16
  checkpoint: true
