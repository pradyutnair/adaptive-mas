llm_defaults:
  model: Qwen/Qwen3-14B
  base_url: http://localhost:8001/v1
  base_urls:
    - http://localhost:8001/v1
    - http://localhost:8002/v1
    - http://localhost:8003/v1
  api_key: EMPTY
  temperature: 0.0
  max_tokens: 1024
  enable_thinking: false
  timeout_seconds: 600

agents:
  orchestrator:
    max_tokens: 1536
    enable_thinking: false
  investigator:
    max_tokens: 1024
    enable_thinking: false

retriever:
  base_url: http://node408:8003
  top_k: 5
  timeout_seconds: 30

pipeline:
  max_turns: 8
  max_searches_per_subagent: 3
  min_fact_confidence: 0.3
  max_answer_words: 8
  context_token_budget: 7000

runner:
  concurrency: 24
