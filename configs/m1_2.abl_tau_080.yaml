# Ablation: tau sweep at 0.80.
# The shipped tau is fixed a priori at 0.70 in m1_2.sufficiency.yaml.
# This sweep is reported as a robustness check; it MUST NOT be used to
# select the shipped tau.

variant: m1_2_sufficiency_tau_080

orchestrator:
  max_steps: 4
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4
  search_top_k: 5
  min_fact_confidence: 0.50
  use_strict_distill: true

fact_memory:
  capacity: 4
  strategy: salience

adaptive:
  sufficiency_controller: true
  sufficiency_threshold: 0.80
  sufficiency_max_recurse_steps: 4
  sufficiency_min_recurse_steps: 1
  bootstrap_search_top_k: 5
  bootstrap_max_read: 6

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
