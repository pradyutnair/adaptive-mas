# Adaptive Recursive SAGE — S0 cap4
# Single retrieval pass, no recursion, with evidence capsule width matched to frozen M1.1.

variant: s0_cap4

orchestrator:
  max_steps: 0
  max_verify_calls: 0

investigator:
  evidence_capsule_limit: 4

fact_memory:
  capacity: 4

llm:
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  temperature: 0.6
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

data:
  chunks_file: data/musique/chunks.json
  index_dir: data/musique/index_e5_base_v2
  embedding_model: intfloat/e5-base-v2

runner:
  concurrency: 24
  checkpoint: true
